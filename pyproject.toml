[project]
name = "purin"
version = "0.1.0"
description = "Reusable agent runtime for Purin."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "tokenizers>=0.22,<0.24",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
openai = ["openai>=1.68,<3"]
interfaces = [
    "aiohttp>=3.11,<4",
    "jinja2>=3.1,<4",
    "markdown-it-py>=4,<5",
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.9,<0.2",
    "av>=16",
    "pillow>=11",
    "webrtcvad-wheels>=2.0.14.post1,<3",
    "segno>=1.6,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=9,<10",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purin"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
