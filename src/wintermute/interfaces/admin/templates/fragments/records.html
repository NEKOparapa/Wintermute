{% if conversation %}
<section class="card history-browser">
  <nav class="record-views" aria-label="记录视图">
    {% for key, label in views.items() %}
    <a href="/admin/records?{{ {'conversation': conversation, 'view': key}|urlencode }}"{% if key == view %} aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
  <div id="record-browser" data-conversation="{{ conversation }}" data-view="{{ view }}" data-label="{{ views[view] }}">
    <p class="history-status" role="status">正在读取记录…</p>
  </div>
  <noscript>请启用 JavaScript 以浏览记录。</noscript>
</section>
{% else %}
<p class="card empty">暂无会话。首次登记设备或创建会话后，可在这里查看记录。</p>
{% endif %}
