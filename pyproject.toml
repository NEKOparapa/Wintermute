[project]
name = "wintermute"
version = "0.1.0"
description = " AI "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.38.0",
    "tiktoken>=0.7.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
