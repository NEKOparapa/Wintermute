{% extends "layout.html" %}
{% block title %}管理员登录{% endblock %}
{% block content %}
<section class="card login-card">
  <div class="wordmark">Purin<span>管理后台</span></div>
  <h1>管理员登录</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form class="form-stack" method="post" action="/admin/login">
    <label for="password">管理员口令</label>
    <input id="password" type="password" name="password" maxlength="1024"
           autocomplete="current-password" required autofocus>
    <button class="button primary" type="submit">登录</button>
  </form>
</section>
{% endblock %}
