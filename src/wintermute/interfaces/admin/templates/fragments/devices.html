<div id="device-content" hx-target="#device-content" hx-swap="outerHTML" hx-sync="#device-content:replace">
  <header class="device-toolbar">
    <div>
      <h1>设备管理</h1>
      <p>最近 {{ fresh_seconds }} 秒内有连接活动的设备显示为在线。</p>
    </div>
    <div class="device-actions">
      <form method="get" action="/admin/devices" hx-get="/admin/devices?section=status"
            hx-trigger="submit, every 10s" hx-target="#device-groups" hx-swap="outerHTML"
            hx-select="#device-groups" hx-select-oob="#archive-count,#archive-rows" hx-sync="#device-content:drop">
        <button type="submit" class="button secondary">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 8A7.4 7.4 0 0 1 18 6.5l2 3M4 14.5l2 3A7.4 7.4 0 0 0 18.4 16"/></svg>
          刷新
        </button>
      </form>
      <form method="post" action="/admin/devices" hx-post="/admin/devices"
            hx-target="#device-pairing-area" hx-select="#device-pairing-area" hx-disabled-elt="find button">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="operation" value="pair">
        <button type="submit" id="add-device" class="button primary" aria-haspopup="dialog">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          添加设备
        </button>
      </form>
    </div>
  </header>

  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  {% if notice %}<p class="notice success" role="status">{{ notice }}</p>{% endif %}
  {% include "fragments/device_pairing.html" %}
  {% include "fragments/device_roster.html" %}
</div>
