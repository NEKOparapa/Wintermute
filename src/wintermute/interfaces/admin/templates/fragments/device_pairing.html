<div id="device-pairing-area" hx-target="this" hx-select="#device-pairing-area" hx-swap="outerHTML">
  {% if pair_url %}
  <dialog class="device-pairing" id="device-pairing" aria-labelledby="pairing-title" open>
    <header class="pairing-heading">
      <h2 id="pairing-title" tabindex="-1" autofocus>添加设备</h2>
      <a class="pairing-close" href="/admin/devices" aria-label="关闭">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </a>
    </header>

    <p class="muted">用手机端扫码，或在客户端粘贴配对链接。邀请在 {{ pairing_minutes }} 分钟内有效，可连接一台设备。</p>
    <img class="pair-qr" src="{{ pair_qr }}" alt="设备配对二维码" width="216" height="216">
    <label for="pair-link">配对链接</label>
    <div class="pairing-copy">
      <input id="pair-link" value="{{ pair_url }}" readonly>
      <button class="button secondary" type="button" data-copy="pair-link">复制链接</button>
    </div>
  </dialog>
  {% endif %}
</div>
